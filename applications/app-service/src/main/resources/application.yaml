server:
  port: 8080
spring:
  application:
    name: "AuthenticationService"
  devtools:
    add-properties: false
  sql:
    init:
      mode: always
      schema-locations: classpath:/migrations/schema.sql
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: auth-db
    schema: public
    username: admin
    password: admin

springdoc:
  show-actuator: false
  swagger-ui:
    operations-sorter: alpha
    disable-swagger-default-url: true
